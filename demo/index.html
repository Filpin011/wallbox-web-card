<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallbox WEB card – demo</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 24px 16px; background: #111318; font-family: Inter, system-ui, sans-serif; color: #f4f5f7; }
      h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
      h2 { font-size: 14px; font-weight: 600; margin: 28px 0 10px; color: #a3a9b3; }
      p { margin: 0 0 20px; font-size: 13px; color: #a3a9b3; }
      section { max-width: 1480px; padding: 4px 0 8px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
      .grid.tiles { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px 16px; }
      /* sections view: a "minimal" card is half a section wide and one 56 px row high */
      .grid.tiles .card-host { height: 56px; }
      .overview { display: inline-grid; grid-template-columns: 360px 360px 300px; gap: 20px; align-items: start; padding: 16px; background: #111318; }
      .stack { display: grid; gap: 16px; }
      .stack.tiles { gap: 8px; }
      .stack.tiles .card-host { height: 56px; }
      .col { font-size: 12px; color: #7c838e; margin: 0 0 -6px 4px; font-family: ui-monospace, monospace; }
      .stack.tiles .col { margin-bottom: 2px; }
      .cell > span { display: block; font-size: 12px; color: #7c838e; margin: 0 0 6px 4px; }
      .light { background: #fafafa; padding: 12px; border-radius: 16px; }
      ha-card { display: block; }
    </style>
  </head>
  <body>
    <h1>Wallbox WEB card</h1>
    <p id="intro"></p>

    <section id="overview"><div class="overview"><div class="stack" id="ov-full"><span class="col">layout: full</span></div><div class="stack" id="ov-compact"><span class="col">layout: compact</span></div><div class="stack tiles" id="ov-minimal"><span class="col">layout: minimal</span></div></div></section>
    <h2 id="h-full">layout: full</h2>
    <section id="full"><div class="grid" id="grid-full"></div></section>
    <h2 id="h-compact">layout: compact</h2>
    <section id="compact"><div class="grid" id="grid-compact"></div></section>
    <h2 id="h-minimal">layout: minimal</h2>
    <section id="minimal"><div class="grid tiles" id="grid-minimal"></div></section>

    <script type="module">
      // Minimal stand-in of Home Assistant's <ha-card> (in HA the real element is provided by the frontend).
      if (!customElements.get("ha-card")) {
        customElements.define("ha-card", class extends HTMLElement {});
      }
      const lang = new URLSearchParams(location.search).get("lang") === "it" ? "it" : "en";
      document.documentElement.lang = lang;
      await import("../dist/wallbox-web-card.js");

      const L = {
        en: {
          intro: "Mocked data, no Home Assistant needed: Charging, Idle, Suspended, Faulted, Unreachable and the Home Assistant light theme, in the three layouts. Italian: ?lang=it",
          status: { charging: "Charging", idle: "Idle", suspended_evse: "Suspended by station", faulted: "Faulted", unavailable: "Unavailable" },
          behaviour_mode: { personal: "Personal", free: "Free" },
          error: { none: "No error", hgtp: "HGTP – high temperature" },
          names: { charging: "Charging", idle: "Idle", suspended: "Suspended", faulted: "Faulted", unreachable: "Unreachable", light: "Home Assistant light theme" },
        },
        it: {
          intro: "Dati simulati, senza Home Assistant: In carica, Disponibile, Sospesa, Guasto, Non raggiungibile e tema chiaro di Home Assistant, nei tre layout.",
          status: { charging: "In carica", idle: "Disponibile", suspended_evse: "Sospesa dalla colonnina", faulted: "Guasto", unavailable: "Non disponibile" },
          behaviour_mode: { personal: "Personale", free: "Libera" },
          error: { none: "Nessun errore", hgtp: "HGTP – temperatura elevata" },
          names: { charging: "In carica", idle: "Disponibile", suspended: "Sospesa", faulted: "Guasto", unreachable: "Non raggiungibile", light: "tema chiaro di HA" },
        },
      }[lang];
      document.getElementById("intro").textContent = L.intro;

      function makeHass(name, s) {
        const dev = "dev-" + name;
        const ents = {};
        const states = {};
        const add = (platform, key, state, attrs = {}) => {
          const id = `${platform}.${name.toLowerCase()}_${key}`;
          ents[id] = { entity_id: id, device_id: dev, platform: "wallbox_web", translation_key: key };
          states[id] = { entity_id: id, state: String(state), attributes: attrs };
        };
        add("sensor", "status", s.status);
        add("sensor", "power", s.power, { unit_of_measurement: "kW" });
        add("sensor", "max_available_power", 7.4, { unit_of_measurement: "kW" });
        add("sensor", "power_limit", s.limit ?? 6.9, { unit_of_measurement: "kW" });
        add("sensor", "session_energy", s.energy, { unit_of_measurement: "kWh" });
        add("sensor", "session_duration", s.minutes, { unit_of_measurement: "min" });
        add("sensor", "error", s.error ?? "none");
        add("binary_sensor", "problem", s.error && s.error !== "none" ? "on" : "off");
        add("select", "behaviour_mode", s.mode ?? "personal");
        add("sensor", "last_charge_energy", 18.45, { unit_of_measurement: "kWh" });
        add("sensor", "last_charge_cost", 4.43, { unit_of_measurement: "EUR" });
        add("sensor", "last_charge_saving", 12.1, { unit_of_measurement: "EUR" });
        for (const b of ["start", "pause", "resume", "stop"]) add("button", b, s.buttons.includes(b) ? "unknown" : "unavailable");
        const t0 = Date.now() - 95 * 60_000;
        const samples = s.curve
          ? Array.from({ length: 191 }, (_, i) => ({
              t: t0 + i * 30_000,
              powerW: i < 4 ? i * 1800 : Math.max(0, 7200 - Math.max(0, i - 150) * 80 + Math.sin(i / 3) * 60),
            }))
          : [];
        return {
          states,
          entities: ents,
          devices: { [dev]: { id: dev, name } },
          locale: { language: lang },
          language: lang,
          formatEntityState(stateObj) {
            const key = ents[stateObj.entity_id]?.translation_key;
            return L[key]?.[stateObj.state] ?? stateObj.state;
          },
          async callService(domain, service, data) {
            console.log("callService", domain, service, data);
          },
          async callWS(msg) {
            if (msg.type === "wallbox_web/charge_curve") return { charge: s.curve ? { id: 8 } : null, samples };
            return {};
          },
        };
      }

      const S = {
        charging: ["Cupra", { status: "charging", power: 7.2, energy: 11.4, minutes: 95, buttons: ["pause", "stop"], curve: true }],
        idle: ["Garage", { status: "idle", power: 0, energy: 0, minutes: 0, buttons: ["start"] }],
        suspended: ["Guests", { status: "suspended_evse", power: 0, energy: 6.3, minutes: 52, buttons: ["resume", "stop"], curve: true, mode: "free" }],
        faulted: ["Box", { status: "faulted", power: 0, energy: 0, minutes: 0, buttons: [], error: "hgtp" }],
        unreachable: ["Cellar", { status: "unavailable", power: 0, energy: 0, minutes: 0, buttons: [] }],
        light: ["Cupra", { status: "charging", power: 3.6, energy: 2.1, minutes: 25, buttons: ["pause", "stop"], curve: true }, "theme"],
      };

      function addCard(parent, key, config, withLabel = true) {
        const [name, s, appearance] = S[key];
        const cell = document.createElement("div");
        cell.className = "cell";
        if (withLabel) cell.innerHTML = `<span>${name} · ${L.names[key]}</span>`;
        const host = Object.assign(document.createElement("div"), { className: "card-host" });
        const card = document.createElement("wallbox-web-card");
        card.setConfig({ type: "custom:wallbox-web-card", device_id: "dev-" + name, appearance: appearance ?? "app", ...config });
        card.hass = makeHass(name, s);
        if (appearance === "theme") {
          card.style.setProperty("--primary-text-color", "#212121");
          card.style.setProperty("--secondary-text-color", "#727272");
          card.style.setProperty("--ha-card-background", "#ffffff");
          card.style.setProperty("--secondary-background-color", "#f2f2f2");
          const light = Object.assign(document.createElement("div"), { className: "light" });
          host.appendChild(card);
          light.appendChild(host);
          cell.appendChild(light);
          if (config.layout === "minimal") host.style.height = "56px";
        } else {
          host.appendChild(card);
          cell.appendChild(host);
        }
        parent.appendChild(cell);
      }

      const keys = Object.keys(S);
      for (const layout of ["full", "compact", "minimal"]) {
        const grid = document.getElementById(`grid-${layout}`);
        for (const key of keys) addCard(grid, key, { layout });
      }
      // overview (docs/screenshot.png): one column per layout
      addCard(document.getElementById("ov-full"), "charging", { layout: "full" }, false);
      addCard(document.getElementById("ov-compact"), "charging", { layout: "compact" }, false);
      addCard(document.getElementById("ov-compact"), "suspended", { layout: "compact", show_limits: true }, false);
      addCard(document.getElementById("ov-compact"), "idle", { layout: "compact" }, false);
      for (const key of ["charging", "idle", "suspended", "faulted", "unreachable"]) {
        addCard(document.getElementById("ov-minimal"), key, { layout: "minimal" }, false);
      }
      document.body.dataset.ready = "1";
    </script>
  </body>
</html>
